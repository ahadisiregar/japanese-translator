<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japanese ⇄ English Translator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>日本語 ⇄ English</h1>
    <p class="sub">Translate both ways. For Japanese, type kana, kanji or romaji (like <em>konnichiwa</em>).</p>

    <div class="switch">
      <span id="from-name">Japanese</span>
      <button type="button" id="swap" title="Swap languages" aria-label="Swap languages">⇄</button>
      <span id="to-name">English</span>
    </div>

    <div class="panels">
      <section>
        <div class="bar">
          <label for="source" id="source-label">Japanese</label>
          <button type="button" id="speak-src">Listen</button>
        </div>
        <textarea id="source" maxlength="5000"></textarea>
        <div id="hint" class="hint" hidden></div>
        <div class="bar"><span id="count">0 / 5000</span><button type="button" id="clear">Clear</button></div>
      </section>

      <section>
        <div class="bar">
          <label for="target" id="target-label">English</label>
          <button type="button" id="speak-tgt">Listen</button>
        </div>
        <textarea id="target" readonly></textarea>
        <div class="bar"><span id="status" role="status"></span><button type="button" id="copy">Copy</button></div>
      </section>
    </div>

    <button type="button" id="translate" class="primary">Translate</button>
    <p class="note">Translations by <a href="https://mymemory.translated.net" target="_blank" rel="noopener">MyMemory</a>. Press Ctrl/⌘+Enter to translate.
      Romaji tips: write long vowels out (Tokyo = <em>toukyou</em>). Type <em>ha</em> for は inside a word.</p>
  </main>
  <script src="romaji.js"></script>
  <script src="app.js"></script>
</body>
</html>
